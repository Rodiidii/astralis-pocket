<body>
  <div id="app"></div>
  <script>
    // Filet de sécurité : si l'application plante au démarrage, on affiche la cause au lieu d'une page vide.
    (function () {
      function show(msg) {
        var app = document.getElementById('app');
        if (!app || app.children.length) return;
        app.innerHTML = '<div style="max-width:760px;margin:12vh auto;padding:28px;border:1px solid #ffffff30;border-radius:18px;background:#19191d;color:#f3f0ec;font:14px/1.6 system-ui,sans-serif">' +
          '<h2 style="margin:0 0 10px;font-size:22px">Astralis n\u2019a pas pu d\u00e9marrer</h2>' +
          '<p style="margin:0 0 12px;color:#b9b4ae">Envoie-moi le message ci-dessous (ou une capture de cette page).</p>' +
          '<pre style="white-space:pre-wrap;word-break:break-word;margin:0;padding:14px;border-radius:12px;background:#0d0d10;color:#ffb4a8;font-size:12px">' +
          String(msg).replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) + '</pre>' +
          '<p style="margin:14px 0 0;color:#b9b4ae">Astuce : ferme tous les onglets Astralis, fais Ctrl+Maj+Suppr \u2192 efface les donn\u00e9es du site 127.0.0.1:8765, puis recharge.</p></div>';
      }
      window.addEventListener('error', function (e) {
        var where = e.target && e.target.src ? 'Fichier introuvable ou refus\u00e9 : ' + e.target.src : (e.message || 'Erreur') + (e.filename ? '\n' + e.filename + ':' + e.lineno + ':' + e.colno : '');
        setTimeout(function () { show(where); }, 300);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason; setTimeout(function () { show((r && (r.stack || r.message)) || r); }, 300);
      });
      setTimeout(function () { show('Aucun contenu affich\u00e9 apr\u00e8s 4 secondes : le script principal (src/app.js) ne s\u2019est pas ex\u00e9cut\u00e9.'); }, 4000);
    })();
  </script>
  <script src="astralis-fx.js?v=1"></script>
  <script src="card-art-index.js?v=20261103-curated-art-1"></script>
  <script type="module" src="src/app.js?v=20261105-build-motion-cards-1"></script>
  <script>if('serviceWorker'in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname)))addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
